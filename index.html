:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --card:#1a1a1d; --ink:#f4f4f5; --sub:#a1a1aa; --line:#2e2e33; --soft:#232327;

    --up:#4ade80; --down:#f87171;
  }
}
:root[data-theme="dark"]{
  --bg:#111113; --card:#1a1a1d; --ink:#f4f4f5; --sub:#a1a1aa; --line:#2e2e33; --soft:#232327;
  --accent:#818cf8; --fill:rgba(129,140,248,.16); --bar:rgba(129,140,248,.16);
  --up:#4ade80; --down:#f87171;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 28px 7px 10px;cursor:pointer}
select.name{font-size:17px;font-weight:700;border:0;background:transparent;padding-left:0}
.views{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.views button{background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);font:inherit;padding:6px 0 9px;cursor:pointer;white-space:nowrap}
.views button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px}
.kpis{display:flex;flex-wrap:wrap}
.kpi{flex:1 1 120px;padding:12px 16px;border-right:1px solid var(--line);background:none;border-top:0;border-bottom:0;border-left:0;text-align:left;font:inherit;color:inherit;cursor:default}
.kpi:last-child{border-right:0}
button.kpi{cursor:pointer}
.kpi .lab{font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--sub)}
.kpi .val{font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.kpi .d{font-size:12px;color:var(--sub);margin-top:1px;min-height:18px}
button.kpi[aria-pressed="true"] .lab{color:var(--accent)}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}
.chart{padding:14px 12px 6px;margin-top:12px}
.chart .cap{font-size:12px;color:var(--sub);padding:0 4px 4px}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--sub);font-size:11px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.panels>*{min-width:0}
@media (max-width:720px){.panels{grid-template-columns:1fr}.kpi{flex-basis:45%;border-bottom:1px solid var(--line)}}
.panel{padding:14px 16px 8px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.ph .t{font-weight:700;font-size:12.5px}
.ph .t.tab{color:var(--sub);font-weight:600;cursor:pointer;margin-right:12px;background:none;border:0;font:inherit;font-size:12.5px;padding:0}
.ph .t.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.ph .cols{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.row{position:relative;display:flex;justify-content:space-between;gap:10px;padding:5px 6px;margin:1px 0;font-size:13.5px;border-radius:4px}
.row i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:4px;z-index:0}
.row span{position:relative;z-index:1}
.row .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.row .v{white-space:nowrap;text-align:right}
.row .v b{display:inline-block;min-width:54px;margin-left:10px;text-align:right;font-weight:600}
.empty{color:var(--sub);font-size:13px;padding:14px 6px}
details{margin-top:12px;font-size:13px;color:var(--sub)}
details summary{cursor:pointer;color:var(--sub);padding:4px 0}
details p{margin:6px 0;line-height:1.6}
details b{color:var(--ink)}
.foot{margin-top:24px;color:var(--sub);font-size:12px}
.ov td,.ov th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ov th{font-size:11.5px;color:var(--sub);font-weight:600}
.ov table{width:100%;border-collapse:collapse;font-size:13.5px}
.flat{color:var(--sub)}
</style>

  const step = Math.ceil(pts.length / 9);
  pts.forEach((p, i) => {
    g += `<circle cx="${x(i)}" cy="${y(p.value)}" r="${p.active ? 5 : 3}" style="fill:var(--accent)"><title>${esc(p.label)}: ${esc(fmt(p.value))}</title></circle>`;
    if (i % step === 0 || p.active) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<div class="box chart">${title ? `<div class="cap">${esc(title)}</div>` : ""}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title || "추이")}">${g}</svg></div>`;
}

function parseNum(s) {
  const m = String(s).replace(/,/g, "").match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}

function listPanel(title, head, rows, opts = {}) {
  // rows: [[label, v1, v2, ...]] — 첫 숫자 열 기준으로 옅은 막대를 깐다
  const nums = rows.map(r => parseNum(r[1]));
  const max = Math.max(...nums.filter(n => n != null), 0) || 1;
  const body = rows.length ? rows.map((r, i) => {
    const w = nums[i] != null ? Math.max(2, 100 * nums[i] / max) : 0;
    return `<div class="row"><i style="width:${w}%"></i><span class="l" title="${esc(r[0])}">${esc(r[0])}</span><span class="v">${r.slice(1).map(v => `<b>${esc(v)}</b>`).join("")}</span></div>`;
  }).join("") : `<div class="empty">자료 없음</div>`;
  return `<div class="box panel"><div class="ph"><span class="t">${esc(title)}</span><span class="cols">${head.slice(1).map(h => `<span style="display:inline-block;min-width:54px;margin-left:10px;text-align:right">${esc(h)}</span>`).join("")}</span></div>${body}</div>`;
}

function infoNote(text, label = "참고") {
  return text ? `<details><summary>ⓘ ${label}</summary><p>${esc(text)}</p></details>` : "";
}

/* ---------- 카페24 주간 화면 ---------- */
function cafe24View(c) {
  const w = c.weeks[Math.min(S.week, c.weeks.length - 1)];
  const s = w.summary, vp = w.vs_prev;
  const items = [
    {key: "sales", lab: "매출", val: won(s.sales), dHtml: delta(vp.sales)},
    {key: "orders", lab: "주문", val: num(s.orders) + "건", dHtml: delta(vp.orders)},
    {key: "visits", lab: "방문", val: num(s.visits), dHtml: delta(vp.visits)},
    {key: "conversion_rate", lab: "전환율", val: pct(s.conversion_rate), dHtml: delta(vp.conversion_rate)},
    {key: "aov", lab: "객단가", val: won(s.aov), dHtml: delta(vp.aov)},
  ];
  const fmt = S.metric === "sales" || S.metric === "aov" ? compact : S.metric === "conversion_rate" ? v => v.toFixed(1) + "%" : num;
  const pts = c.trend.map(t => ({label: mmdd(t.start), value: t[S.metric], active: t.start === w.start}));
  let h = kpiRow(items, S.metric, true);
  h += lineChart(pts, fmt, "주별 흐름 · " + items.find(i => i.key === S.metric).lab);
  h += `<div class="panels">`;
  // 왼쪽: 채널 / 매출 콘텐츠
  const ch = w.channels.slice(0, 8).map(r => [r.name, num(r.visits), num(r.orders)]);
  const ut = w.utm_contents.slice(0, 8).map(r => [r.name + (r.channel ? ` · ${r.channel}` : ""), num(r.orders), won(r.sales)]);
  const left = S.ptab === 0
    ? listPanel("채널", ["", "방문", "주문"], ch)
    : listPanel("매출 낸 콘텐츠", ["", "주문", "매출"], ut);
  h += `<div>${left.replace('<span class="t">' + (S.ptab === 0 ? "채널" : "매출 낸 콘텐츠") + "</span>",
    `<button class="t tab" data-p="0" aria-selected="${S.ptab === 0}">채널</button><button class="t tab" data-p="1" aria-selected="${S.ptab === 1}">매출 콘텐츠</button>`)}</div>`;
  h += listPanel("상품 (조회순)", ["", "조회", "주문"], w.products.map(r => [r.name, num(r.views), num(r.orders)]));
  h += `</div>`;
  // 실시간 키워드
  const k = (DATA.keywords[c.name] || {}), ks = Object.keys(k).sort().slice(-4).reverse();
  if (ks.length) h += `<div style="margin-top:12px">${listPanel("실시간 키워드 후보 (주별)", ["", "후보", "발행"], ks.map(x => [mmdd(x) + " ~", num(k[x]["후보"]), num(k[x]["발행"])]))}</div>`;
  // 신호는 접어 둔다
  if (w.signals && w.signals.length) h += `<details><summary>ⓘ 이번 주 개선 신호 ${w.signals.length}개</summary>${w.signals.slice(0, 6).map(g => `<p><b>${esc(g.area)}</b> · ${md(g.finding)}<br>${md(g.action)}</p>`).join("")}</details>`;
  const notes = [];
  if (w.tracking_rate != null && w.tracking_rate < 50) notes.push(`추적률 ${pct(w.tracking_rate, 0)}: 매출이 어디서 왔는지 아는 비율이 낮습니다. 링크에 UTM을 붙이면 올라갑니다.`);
  if (c.weeks.length < 3) notes.push(`주간 자료가 ${c.weeks.length}주치뿐이라 흐름은 아직 약합니다.`);
  h += infoNote(notes.join(" "), "읽을 때 참고");
  return h;
}

/* ---------- 따로 모은 자료 화면 ---------- */
function blockView(b) {
  let h = "";
  if (b.kpis && b.kpis.length) h += kpiRow(b.kpis, null, false);
  if (b.bars) h += lineChart(b.bars.labels.map((l, i) => ({label: l, value: b.bars.values[i], active: false})), num, b.bars.title);
  const tabs = [b.table, b.table2, b.table3, b.table4].filter(Boolean);
  const wide = tabs.filter(t => t.head.length > 3), narrow = tabs.filter(t => t.head.length <= 3);   // 열이 많은 표는 가로 전체로
  h += wide.map(t => `<div style="margin-top:12px">${listPanel(t.title || "", t.head, t.rows)}</div>`).join("");
  if (narrow.length) h += `<div class="panels">${narrow.map(t => listPanel(t.title || "", t.head, t.rows)).join("")}</div>`;
  h += infoNote(b.note, "읽을 때 참고");
  h += `<div class="foot">${esc(b.period || "")}${b.source ? " · " + esc(b.source) : ""}</div>`;
  return h;
}

function keywordsView(c) {
  const k = c.name === "그날의책" ? (DATA.family_keywords || {}) : (DATA.keywords[c.name] || {});
  const ks = Object.keys(k).sort().slice(-6).reverse();
  return ks.length ? listPanel("실시간 키워드 후보 (주별)", ["", "후보", "발행"], ks.map(x => [mmdd(x) + " ~", num(k[x]["후보"]), num(k[x]["발행"])]))
    : `<div class="box"><div class="empty">후보 기록 없음 (11/3부터 판단 중, 지금까지 후보 0건)</div></div>`;
}

function overviewView() {
  const rows = DATA.overview.map(o => {
    const have = [];
    if (o.cafe24) have.push(`카페24 주간 ${o.cafe24}주`);
    o.blocks.forEach(t => have.push(t.split(" (")[0]));
    if (o.keyword) have.push("실시간 키워드");
    return `<tr><td><b>${esc(o.name)}</b></td><td>${have.length ? have.map(esc).join(" · ") : '<span class="flat">연결된 자료 없음</span>'}</td></tr>`;
  }).join("");
  return `<div class="box ov"><table><tr><th>업체</th><th>붙어 있는 자료</th></tr>${rows}</table></div>
    ${infoNote("'연결된 자료 없음'은 그 업체의 사이트·유튜브·블로그 통계를 확인하지 않았거나 주간으로 저장하지 않았다는 뜻이고, 통계가 0이라는 뜻이 아닙니다.", "읽을 때 참고")}`;
}

/* ---------- 화면 구성 ---------- */
function viewsOf(c) {
  const v = [];
  if (c.weeks.length) v.push({label: "매출", html: () => cafe24View(c), weeks: true});
  (c.blocks || []).forEach(b => v.push({label: b.title.split(" (")[0], html: () => blockView(b)}));
  if (!c.weeks.length && (c.name === "그날의책" || Object.keys(DATA.keywords[c.name] || {}).length)) v.push({label: "키워드", html: () => keywordsView(c)});
  return v;
}

function render() {
  const sel = $("#client");
  sel.innerHTML = DATA.clients.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join("") + `<option value="${nClients}">연결 현황</option>`;
  sel.value = S.client;
  const wk = $("#week");
  if (S.client >= nClients) { wk.style.display = "none"; $("#views").innerHTML = ""; $("#app").innerHTML = overviewView(); return; }
  const c = DATA.clients[S.client], vs = viewsOf(c);
  S.view = Math.min(S.view, vs.length - 1);
  $("#views").innerHTML = vs.map((v, i) => `<button role="tab" data-v="${i}" aria-selected="${i === S.view}">${esc(v.label)}</button>`).join("");
  if (!vs.length) { wk.style.display = "none"; $("#app").innerHTML = `<div class="box"><div class="empty">이 업체는 아직 연결된 자료가 없습니다.</div></div>`; return; }
  const cur = vs[S.view];
  wk.style.display = cur.weeks ? "" : "none";
  if (cur.weeks) {
    S.week = Math.min(S.week, c.weeks.length - 1);
    wk.innerHTML = c.weeks.map((w, i) => `<option value="${i}">${w.start} ~ ${w.end}</option>`).join("");
    wk.value = S.week;
  }
  $("#app").innerHTML = cur.html();
  document.querySelectorAll("#app button.kpi").forEach(b => b.onclick = () => { S.metric = b.dataset.k; render(); });
  document.querySelectorAll("#app .ph .tab").forEach(b => b.onclick = () => { S.ptab = +b.dataset.p; render(); });
}

$("#client").onchange = e => { S.client = +e.target.value; S.view = 0; S.week = 1e9; S.ptab = 0; render(); };
$("#week").onchange = e => { S.week = +e.target.value; render(); };
$("#views").onclick = e => { const b = e.target.closest("button"); if (b) { S.view = +b.dataset.v; render(); } };
$("#foot").textContent = `생성 ${DATA.generated} · 읽기 전용`;
render();
</script>
</body>
</html>
